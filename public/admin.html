<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Knowledge Admin</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <h1>Nexus Admin</h1>
          <p>GitHub Knowledge Uploader</p>
        </div>
      </div>

      <button class="nav active" data-panel="article">Article</button>
      <button class="nav" data-panel="topic">Topic Card</button>
      <button class="nav" data-panel="risk">Risk Family</button>
      <button class="nav" data-panel="rule">Clinical Rule</button>
      <button class="nav" data-panel="drug">Drug Monograph</button>
      <button class="nav" data-panel="library">Saved Items</button>

      <div class="hint">
        كل item هيتحفظ كفايل لوحده على GitHub، وملف <code>data/index.json</code> هيتحدث تلقائيًا.
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="title">Article</h2>
          <p id="subtitle">Save a complete Markdown article to GitHub.</p>
        </div>
        <div class="actions">
          <button id="saveLocalBtn" class="secondary">Save Locally</button>
          <button id="uploadGitHubBtn" class="primary">Upload to GitHub</button>
          <button id="clearBtn" class="secondary">Clear</button>
        </div>
      </header>

      <section class="panel active" id="panel-article">
        <div class="grid">
          <label>Article ID <input id="articleId" placeholder="article_hyperkalemia_overview_001"></label>
          <label>Title <input id="articleTitle" placeholder="Hyperkalemia Overview"></label>
          <label>Topic <input id="articleTopic" placeholder="hyperkalemia"></label>
          <label>Source ID <input id="articleSourceId" placeholder="src_hyperkalemia_overview_001"></label>
        </div>
        <label>Tags comma separated <input id="articleTags" placeholder="hyperkalemia, potassium, CKD, ECG"></label>
        <label>Full Article Markdown <textarea id="articleBody" class="big" placeholder="Paste the full article here..."></textarea></label>
      </section>

      <section class="panel" id="panel-topic">
        <div class="grid">
          <label>Topic ID <input id="topicId" placeholder="topic_hyperkalemia"></label>
          <label>Name <input id="topicName" placeholder="Hyperkalemia"></label>
          <label>Type
            <select id="topicType">
              <option value="condition">condition</option>
              <option value="drug_class">drug_class</option>
              <option value="pharmacy_practice">pharmacy_practice</option>
              <option value="otc_topic">otc_topic</option>
            </select>
          </label>
          <label>Source IDs <input id="topicSourceIds" placeholder="src_hyperkalemia_overview_001"></label>
        </div>
        <label>Definition <textarea id="topicDefinition"></textarea></label>
        <label>Overview <textarea id="topicOverview"></textarea></label>
        <label>Key Points / Causes, one per line <textarea id="topicKeyPoints"></textarea></label>
        <label>Assessment, one per line <textarea id="topicAssessment"></textarea></label>
        <label>Red Flags, one per line <textarea id="topicRedFlags"></textarea></label>
      </section>

      <section class="panel" id="panel-risk">
        <div class="grid">
          <label>Risk ID <input id="riskId" placeholder="risk_hyperkalemia"></label>
          <label>Label <input id="riskLabel" placeholder="Hyperkalemia"></label>
          <label>Default Severity
            <select id="riskSeverity">
              <option>Low</option><option>Moderate</option><option selected>High</option><option>Critical</option>
            </select>
          </label>
          <label>Source IDs <input id="riskSourceIds" placeholder="src_hyperkalemia_overview_001"></label>
        </div>
        <label>Description <textarea id="riskDescription"></textarea></label>
        <label>Common Triggers, one per line <textarea id="riskTriggers"></textarea></label>
        <label>Monitoring, one per line <textarea id="riskMonitoring"></textarea></label>
        <label>Red Flags, one per line <textarea id="riskRedFlags"></textarea></label>
        <label>Pharmacist Actions, one per line <textarea id="riskActions"></textarea></label>
      </section>

      <section class="panel" id="panel-rule">
        <div class="grid">
          <label>Rule ID <input id="ruleId" placeholder="rule_acei_potassium_hyperkalemia_001"></label>
          <label>Title <input id="ruleTitle" placeholder="ACE inhibitor + potassium supplement"></label>
          <label>Risk Family <input id="ruleRiskFamily" placeholder="risk_hyperkalemia"></label>
          <label>Severity
            <select id="ruleSeverity">
              <option>Low</option><option>Moderate</option><option selected>High</option><option>Critical</option>
            </select>
          </label>
        </div>
        <label>Triggers, one per line <textarea id="ruleTriggers"></textarea></label>
        <label>Clinical Meaning <textarea id="ruleClinicalMeaning"></textarea></label>
        <label>Missing Data, one per line <textarea id="ruleMissingData"></textarea></label>
        <label>Pharmacist Actions, one per line <textarea id="ruleActions"></textarea></label>
        <label>Patient Counseling, one per line <textarea id="ruleCounseling"></textarea></label>
        <label>Source IDs <input id="ruleSourceIds" placeholder="src_hyperkalemia_overview_001"></label>
      </section>

      <section class="panel" id="panel-drug">
        <div class="grid">
          <label>Drug ID <input id="drugId" placeholder="drug_ramipril"></label>
          <label>Generic Name <input id="drugName" placeholder="Ramipril"></label>
          <label>Class <input id="drugClass" placeholder="ACE inhibitor"></label>
          <label>Source IDs <input id="drugSourceIds" placeholder="src_enf_cardiovascular_2024"></label>
        </div>
        <label>Indications, one per line <textarea id="drugIndications"></textarea></label>
        <label>Dose / Regimen, one per line <textarea id="drugDose"></textarea></label>
        <label>Warnings, one per line <textarea id="drugWarnings"></textarea></label>
        <label>Monitoring, one per line <textarea id="drugMonitoring"></textarea></label>
        <label>Counseling, one per line <textarea id="drugCounseling"></textarea></label>
        <label>Risk Families, one per line <textarea id="drugRisks"></textarea></label>
      </section>

      <section class="panel" id="panel-library">
        <div class="library-actions">
          <button id="downloadIndexBtn" class="secondary">Download index.json</button>
          <button id="resetBtn" class="danger">Reset Local</button>
        </div>
        <div class="split">
          <div>
            <h3>Saved locally</h3>
            <div id="list"></div>
          </div>
          <div>
            <h3>Preview</h3>
            <pre id="preview"></pre>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
